# Scenarios using files: littlefs on the simulated flash, mounted at /lfs by
# the board overlay. OSAL volumes live in /lfs.
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_FILE_SYSTEM_LITTLEFS=y
CONFIG_CFS_OSAL_FILESYS_ROOT="/lfs"

# Match OS_MAX_NUM_OPEN_FILES, which the tests exhaust. Formatting a volume
# opens one directory beyond OS_MAX_NUM_OPEN_DIRS.
CONFIG_FS_LITTLEFS_NUM_FILES=50
CONFIG_FS_LITTLEFS_NUM_DIRS=8
