CONFIG_CFS_OSAL=y

# OSAL startup and ut_assert run on the main thread.
CONFIG_MAIN_STACK_SIZE=8192

# The OSAL tests create tasks without supplying a stack.
CONFIG_CFS_OSAL_DYNAMIC_TASK_STACKS=y
CONFIG_HEAP_MEM_POOL_SIZE=1048576

# 32-bit targets without an SRAM size (native_sim) default to small heaps,
# which are capped at 256 KiB. Larger heaps then fail every allocation.
CONFIG_SYS_HEAP_AUTO=y
