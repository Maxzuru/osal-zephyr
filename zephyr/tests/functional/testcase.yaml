# OSAL functional tests (src/tests, src/unit-tests) on Zephyr.
#
# Each scenario builds one OSAL test. Tags name the OSAL area it validates,
# so a single area can be run with e.g. `west twister -T zephyr/tests --tag binsem`.
# Add scenarios here as areas are ported.

common:
  platform_allow:
    - native_sim
    - qemu_x86
  integration_platforms:
    - native_sim
  tags: osal
  timeout: 120
  harness: console
  harness_config:
    type: one_line
    regex:
      - "Application exit status: SUCCESS"
    record:
      regex:
        - "\\[ *(?P<type>FAIL|TSF|TTF|ABORT)\\] (?P<case>\\S+) (?P<message>.*)"

tests:
  osal.functional.bin_sem:
    tags: binsem
    extra_args: OSAL_TEST=tests/bin-sem-test
  osal.functional.bin_sem_timeout:
    tags: binsem
    extra_args: OSAL_TEST=tests/bin-sem-timeout-test
  osal.functional.count_sem:
    tags: countsem
    extra_args: OSAL_TEST=tests/count-sem-test
  osal.functional.count_sem_timeout:
    tags: countsem
    extra_args: OSAL_TEST=tests/count-sem-timeout-test
  osal.functional.mutex:
    tags: mutex
    extra_args: OSAL_TEST=tests/mutex-test
  osal.functional.condvar:
    tags: condvar
    extra_args: OSAL_TEST=tests/condvar-test
  osal.functional.queue:
    tags: queue
    extra_args: OSAL_TEST=tests/queue-test
  osal.functional.idmap_api:
    tags: idmap
    extra_args: OSAL_TEST=tests/idmap-api-test
  osal.functional.time_base_api:
    tags: timebase
    extra_args: OSAL_TEST=tests/time-base-api-test
  osal.functional.timer:
    tags: timer
    extra_args: OSAL_TEST=tests/timer-test
  osal.functional.timer_add_api:
    tags: timer
    extra_args: OSAL_TEST=tests/timer-add-api-test
  osal.functional.file_api:
    tags: file
    extra_args:
      - OSAL_TEST=tests/file-api-test
      - EXTRA_CONF_FILE=fs.conf
  osal.functional.file_sys_add_fixed_map_api:
    tags: file
    extra_args:
      - OSAL_TEST=tests/file-sys-add-fixed-map-api-test
      - EXTRA_CONF_FILE=fs.conf
  osal.functional.osfile:
    tags: file
    extra_args:
      - OSAL_TEST=unit-tests/osfile-test
      - EXTRA_CONF_FILE=fs.conf
  osal.functional.osfilesys:
    tags: file
    extra_args:
      - OSAL_TEST=unit-tests/osfilesys-test
      - EXTRA_CONF_FILE=fs.conf
  # network-api-test is not listed: its shutdown passes need TCP half-close,
  # which the native stack lacks, and a connection the client closes before
  # the server accepts it, which the native stack discards.
  osal.functional.select:
    tags: network
    extra_args:
      - OSAL_TEST=tests/select-test
      - EXTRA_CONF_FILE=net.conf
    # The tests use only loopback. Drop QEMU's default SLIP link, which
    # needs tunslip6 running on the host.
    extra_configs:
      - platform:qemu_x86/atom:CONFIG_NET_SLIP_TAP=n
